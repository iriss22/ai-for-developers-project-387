[global]
# Длинные строки в русской прозе не переносим вручную
disable = ["MD013"]
# CHANGELOG.md генерирует release-please; правки в нём затрутся следующим релизом
exclude = ["CHANGELOG.md"]

[MD033]
# Блок <details> с описанием тестов Хекслета пришёл из шаблона репозитория
allowed_elements = ["details", "summary"]
