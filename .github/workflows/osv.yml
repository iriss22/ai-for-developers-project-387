name: osv-scanner

# Известные уязвимости в зависимостях. Уязвимости публикуют без изменений в нашем коде,
# поэтому проверка идёт по расписанию, а не в `mise run check` на каждый push.
on:
  schedule:
    # понедельник, 07:23 по Москве (04:23 UTC) — не чаще одного раза в сутки
    - cron: '23 4 * * 1'
  # сразу проверить изменения зависимостей, в том числе PR от Renovate
  push:
    branches:
      - '**'
    paths:
      - backend/pom.xml
      - package-lock.json
      - contract/package-lock.json
      - frontend/package-lock.json
  # ручной запуск из любой ветки: проверить зависимости здесь и сейчас
  workflow_dispatch:

# Параллельные аудиты по одной ветке не нужны: новый запуск отменяет предыдущий.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      findings: ${{ steps.count.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java для SBOM бэкенда и osv-scanner строго по версиям из mise.toml
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      # Отчёт в JSON для агента и артефакта. Сканер возвращает ненулевой код
      # при находках, поэтому `|| true`: падение разбирает job report.
      - name: Scan dependencies
        run: |
          (cd backend && ./mvnw -q -B cyclonedx:makeBom)
          # Флаги формата — после `scan source`: глобальные позиции сканер
          # не принимает. Ненулевой код при находках гасим `|| true`:
          # разбор отчёта делает job report.
          osv-scanner scan source --format json \
            backend/target/calendar.cdx.json \
            package-lock.json \
            contract/package-lock.json \
            frontend/package-lock.json \
            > osv-report.json || true
          # Пустой отчёт — это сбой сканера, а не «находок нет».
          test -s osv-report.json || { echo "osv-scanner не оставил отчёт"; exit 1; }

      - name: Count findings
        id: count
        run: |
          count=$(jq '[.. | objects | .vulnerabilities? // empty | .[]?] | length' osv-report.json)
          echo "findings=$count" >> "$GITHUB_OUTPUT"
          echo "OSV-находок: $count" >> "$GITHUB_STEP_SUMMARY"

      # Отчёт — артефакт прогона, а не файл репозитория: в коммиты не попадает.
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-report
          path: osv-report.json

  report:
    # Разбор отчёта агентом: вывод сохраняем всегда, issue создаём только
    # по реальным находкам и без дублей. Запускаем даже если audit упал.
    # Агент — opencode CLI (`opencode run --auto`): GitHub Action
    # anomalyco/opencode принимает только события issue/PR, а здесь
    # триггеры schedule, push и workflow_dispatch.
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Выбранный способ авторизации — GITHUB_TOKEN этого прогона:
      # contents на чтение отчёта, issues на создание находок. OIDC не нужен:
      # агент ходит в GitHub через gh с GH_TOKEN.
      contents: read
      issues: write
    env:
      FINDINGS: ${{ needs.audit.outputs.findings }}
      REPORT_PATH: report/osv-report.json
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410b181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osv-report
          path: report

      # opencode ставит mise по версии из mise.toml (как osv-scanner
      # в job audit): версия фиксируется репозиторием.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Run audit agent
        shell: bash
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          opencode run --auto \
            --model moonshotai/kimi-k3.1-pro \
            -- "$(cat .github/prompts/osv-audit.md)" | tee agent-output.md

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: agent-output.md

      - name: Show agent output in summary
        if: always()
        run: |
          {
            echo "## Вывод агента аудита"
            echo
            cat agent-output.md 2>/dev/null || echo "Агент не оставил agent-output.md"
          } >> "$GITHUB_STEP_SUMMARY"
